services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    ports:
      - "3001:3001"

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
