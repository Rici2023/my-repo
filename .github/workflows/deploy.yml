name: Deploy to Hetzner (Docker Compose)

on:
  push:
    branches: ["my-repo"]   # ← podmień na swoją gałąź, jeśli inna (np. main)
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync project to server
        run: |
          rsync -az --delete \
            --exclude ".git" \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/app/

      - name: Build & run on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}   # opcjonalnie; jeśli nie ustawisz, nie nadpisze .env
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -seu' <<'EOF'
          set -euo pipefail
          cd /var/www/app

          # wybór pliku compose
          if [ -f compose.yaml ]; then
            COMPOSE=compose.yaml
          elif [ -f docker-compose.yml ]; then
            cp docker-compose.yml compose.yaml
            COMPOSE=compose.yaml
          else
            echo "❌ Brak compose.yaml / docker-compose.yml w /var/www/app"; ls -la; exit 1
          fi

          # normalizacja (BOM/CRLF)
          sed -i '1s/^\xEF\xBB\xBF//' "$COMPOSE" || true
          tr -d '\r' < "$COMPOSE" > .tmp && mv .tmp "$COMPOSE"

          # upewnij się, że backend/.env istnieje (z GitHub Secrets, jeśli podany)
          mkdir -p backend
          if [ ! -f backend/.env ] && [ -n "${JWT_SECRET:-}" ]; then
            cat > backend/.env <<ENV
          JWT_SECRET=${JWT_SECRET}
          PORT=3001
          NODE_ENV=production
          DB_PATH=./data/app.db
          CORS_ORIGIN=*
          COOKIE_SECURE=false
          ENV
          fi

          # wybór komendy compose (v2/v1)
          if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi

          # walidacja i uruchomienie
          $DC -f "$COMPOSE" config >/dev/null
          $DC -f "$COMPOSE" up -d --build
          $DC -f "$COMPOSE" ps
          EOF
