name: Deploy to Hetzner (Docker Compose)

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # === DIAG: sprawdźmy, czy logowanie po SSH działa ===
      - name: Test SSH connectivity
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "echo 'ssh ok'; whoami; hostname; pwd"

      # (opcjonalnie utwórz docelowy katalog i nadaj uprawnienia)
      - name: Ensure /var/www/app exists
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "sudo mkdir -p /var/www/app && sudo chown -R $SSH_USER:$SSH_USER /var/www/app"

      - name: Rsync project to server
        run: |
          set -euxo pipefail
          RSYNC_RSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=yes"
          rsync -azv --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            -e "$RSYNC_RSH" \
            ./ "$SSH_USER@$SSH_HOST:/var/www/app"

      - name: Upload .env to server (only if ENV_PROD set)
        run: |
          set -euxo pipefail
          if [ -n "${{ secrets.ENV_PROD }}" ]; then
            echo "${{ secrets.ENV_PROD }}" > .env
            scp -P "$SSH_PORT" .env "$SSH_USER@$SSH_HOST:/var/www/app/.env"
            rm -f .env
          else
            echo "No ENV_PROD secret set, skipping .env upload."
          fi

      # Sprawdźmy czy Docker/Compose są na serwerze
      - name: Check docker on server
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "docker --version || true; docker compose version || true"

      - name: Build & run with Docker Compose
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
          set -euxo pipefail
          cd /var/www/app
          docker compose pull || true
          docker compose build --no-cache
          docker compose up -d --remove-orphans
          docker compose ps
          EOF

      # Na czas diagnozy niech healthcheck NIE wywala całego joba
      - name: Healthcheck
        continue-on-error: true
        run: |
          curl -v --max-time 20 http://128.140.109.251:3000/ || (echo "Healthcheck failed (ignored for now)")
