name: Deploy to Hetzner (Docker Compose)

on:
  push:
    branches: ["my-repo"]         # ← zmień na swoją gałąź (np. main), jeśli trzeba
  workflow_dispatch:
    inputs:
      ref:
        description: "Gałąź/tag/SHA do wdrożenia"
        required: false
        default: "my-repo"

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Build artifact (tar.gz)
        run: |
          tar --exclude-vcs -czf /tmp/app.tgz .

      - name: Upload artifact to server
        run: |
          scp -P "${{ secrets.SSH_PORT }}" /tmp/app.tgz "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/app.tgz"

      - name: Deploy on server (compose up)
        env:
          DEPLOY_PATH: /var/www/app
          JWT_SECRET: ${{ secrets.JWT_SECRET }}   # opcjonalnie – jeśli brak, wygenerujemy losowy
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -seu' <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/app}"
          mkdir -p "$DEPLOY_PATH"

          # Zachowaj backend/.env i backend/data, resztę wyczyść (pełna synchronizacja)
          TMP="$(mktemp -d)"
          if [ -f "$DEPLOY_PATH/backend/.env" ]; then
            mkdir -p "$TMP/backend"
            cp -a "$DEPLOY_PATH/backend/.env" "$TMP/backend/.env"
          fi
          if [ -d "$DEPLOY_PATH/backend/data" ]; then
            mkdir -p "$TMP/backend/data"
            rsync -a "$DEPLOY_PATH/backend/data/" "$TMP/backend/data/" || true
          fi
          find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          # Wgraj nową wersję
          tar xzf /tmp/app.tgz -C "$DEPLOY_PATH"
          rm -f /tmp/app.tgz

          # Przywróć zachowane pliki
          if [ -f "$TMP/backend/.env" ]; then
            mkdir -p "$DEPLOY_PATH/backend"
            mv "$TMP/backend/.env" "$DEPLOY_PATH/backend/.env"
          fi
          if [ -d "$TMP/backend/data" ]; then
            mkdir -p "$DEPLOY_PATH/backend/data"
            rsync -a "$TMP/backend/data/" "$DEPLOY_PATH/backend/data/" || true
          fi
          rm -rf "$TMP"

          cd "$DEPLOY_PATH"

          # Wybór compose file
          if [ -f compose.yaml ]; then
            COMPOSE=compose.yaml
          elif [ -f docker-compose.yml ]; then
            COMPOSE=docker-compose.yml
          else
            echo "❌ Brak compose.yaml / docker-compose.yml w $DEPLOY_PATH"; ls -la; exit 1
          fi

          # Normalizacja (BOM/CRLF)
          sed -i '1s/^\xEF\xBB\xBF//' "$COMPOSE" || true
          tr -d '\r' < "$COMPOSE" > .tmp && mv .tmp "$COMPOSE"

          # Upewnij się, że backend/.env istnieje – jeśli nie, utwórz
          mkdir -p backend
          if [ ! -f backend/.env ]; then
            if [ -n "${JWT_SECRET:-}" ]; then
              SECRET="${JWT_SECRET}"
            else
              # losowy 64-znakowy hex (fallback bez openssl)
              SECRET="$( (openssl rand -hex 32 2>/dev/null) || (head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n') )"
            fi
            cat > backend/.env <<ENV
          JWT_SECRET=${SECRET}
          PORT=3001
          NODE_ENV=production
          DB_PATH=./data/app.db
          CORS_ORIGIN=*
          COOKIE_SECURE=false
          ENV
          fi

          # Compose v2/v1
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose"
          else
            DC="docker-compose"
          fi

          echo "---- $(pwd)/$COMPOSE (head) ----"
          head -n 20 "$COMPOSE" || true
          echo "--------------------------------"

          # Walidacja i uruchomienie
          $DC -f "$COMPOSE" config >/dev/null
          $DC -f "$COMPOSE" up -d --build
          $DC -f "$COMPOSE" ps
          EOF
