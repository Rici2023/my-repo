name: Deploy to Hetzner (Docker Compose)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync project to server
        run: |
          RSYNC_RSH="ssh -p ${{ secrets.SSH_PORT }}" \
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            ./  ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/app

      - name: Upload .env to server (only if ENV_PROD set)
        run: |
          if [ -n "${{ secrets.ENV_PROD }}" ]; then
            echo "${{ secrets.ENV_PROD }}" > .env
            scp -P "${{ secrets.SSH_PORT }}" .env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/app/.env
            rm -f .env
          else
            echo "No ENV_PROD secret set, skipping .env upload."
          fi

      - name: Build & run with Docker Compose
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            cd /var/www/app
            docker compose pull || true
            docker compose build --no-cache
            docker compose up -d --remove-orphans
          '

      - name: Healthcheck
        run: |
          curl -fsS --max-time 20 http://128.140.109.251:3000/ || (echo "Healthcheck failed" && exit 1)
