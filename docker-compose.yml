services:
  app-web:
    image: nginx:alpine
    container_name: app-web-1
    ports:
      - "127.0.0.1:8081:80"        # tylko localhost -> brak konfliktu z Nginxem na hoście
    volumes:
      - ./public:/usr/share/nginx/html:ro
      # (opcjonalnie własny vhost w kontenerze)
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
