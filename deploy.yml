name: Deploy to Hetzner (Docker Compose)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy files to server
        run: |
          rsync -az --delete --exclude ".git" \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/dashboard-pro/

      - name: Deploy via SSH
        timeout-minutes: 15
        run: |
          ssh -o ConnectTimeout=10 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -euxo pipefail
          cd ~/dashboard-pro
          docker compose pull
          docker compose down --timeout 30
          docker compose up -d --build
          docker system prune -f --filter "until=24h"
          EOF

      - name: Verify deployment
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep dashboard-pro
          "
