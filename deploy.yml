name: Deploy to Hetzner (Docker Compose)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Normalizacja linii i wymuszenie compose.yaml
      - name: Normalize line endings & prepare compose.yaml
        run: |
          sudo apt-get update -y && sudo apt-get install -y dos2unix
          # Jeśli masz docker-compose.yml, skopiuj do compose.yaml
          if [ -f docker-compose.yml ]; then cp docker-compose.yml compose.yaml; fi
          # Usuń BOM/CRLF lokalnie
          [ -f compose.yaml ] || (echo "compose.yaml missing" && exit 1)
          sed -i '1s/^\xEF\xBB\xBF//' compose.yaml || true
          dos2unix -f compose.yaml || true

      # Walidacja lokalna (wyłapie błędy YAML zanim wyślemy na serwer)
      - name: Validate compose locally
        run: |
          docker version
          docker compose version
          docker compose -f compose.yaml config >/dev/null

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Wysyłka jako tarball + rozpakowanie i URUCHOMIENIE na serwerze
      - name: Ship & deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          # Spakuj repo (bez .git)
          tar --exclude-vcs -czf app.tgz .
          # Wyślij
          scp -P "$SSH_PORT" app.tgz "$SSH_USER@$SSH_HOST:/tmp/app.tgz"
          # Rozpakuj i odpal
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -seuo pipefail' <<'EOF'
          set -euo pipefail
          mkdir -p /var/www/app
          tar xzf /tmp/app.tgz -C /var/www/app
          rm -f /tmp/app.tgz
          cd /var/www/app

          # Wymuś compose.yaml (jeśli ktoś w repo używa docker-compose.yml)
          if [ -f docker-compose.yml ] &&
