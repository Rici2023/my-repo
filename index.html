<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Pro</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">Dashboard <span>Pro</span></div>
      <nav>
        <button data-tab="overview" class="active">Przegląd</button>
        <button data-tab="finance">Finanse</button>
        <button data-tab="activities">Aktywności</button>
        <button data-tab="agents">Health</button>
        <button data-tab="roles" id="rolesTab" class="hidden">Role</button>
      </nav>
      <div class="sidebar-bottom">
        <span id="userEmail">—</span>
        <button id="logoutBtn" class="ghost">Wyloguj</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="auth">
          <form id="loginForm">
            <input type="email" id="email" placeholder="email" value="admin@demo.local" required />
            <input type="password" id="password" placeholder="hasło" value="admin123" required />
            <button type="submit">Zaloguj</button>
          </form>
          <div id="logged" class="hidden"><span id="roleBadge" class="badge">user</span></div>
        </div>
      </header>

      <!-- TABS -->
      <section id="tab-overview" class="tab active">
        <h1>Przegląd</h1>
        <div class="kpis">
          <div class="kpi" data-kpi="MRR"><div class="label">MRR</div><div class="value" id="kpi-MRR">—</div><div class="delta" id="delta-MRR">—</div></div>
          <div class="kpi" data-kpi="Active Users"><div class="label">Active Users</div><div class="value" id="kpi-Active Users">—</div><div class="delta" id="delta-Active Users">—</div></div>
          <div class="kpi" data-kpi="Churn"><div class="label">Churn</div><div class="value" id="kpi-Churn">—</div><div class="delta" id="delta-Churn">—</div></div>
          <div class="kpi" data-kpi="NPS"><div class="label">NPS</div><div class="value" id="kpi-NPS">—</div><div class="delta" id="delta-NPS">—</div></div>
        </div>

        <div class="panel">
          <h2>Aktywności (ostatnie)</h2>
          <div class="toolbar">
            <button id="exportActivitiesCsv">Eksport CSV</button>
            <button id="printActivities">PDF/Druk</button>
          </div>
          <table id="activitiesTable" class="table"></table>
        </div>
      </section>

      <section id="tab-finance" class="tab">
        <h1>Finanse</h1>
        <div class="toolbar filters">
          <input type="date" id="invFrom" />
          <input type="date" id="invTo" />
          <select id="invStatus">
            <option value="">Status: wszystkie</option>
            <option>Paid</option>
            <option>Due</option>
            <option>Overdue</option>
          </select>
          <input type="search" id="invQuery" placeholder="Szukaj klienta" />
          <button id="invApply">Filtruj</button>
          <button id="exportInvoicesCsv">Eksport CSV</button>
          <button id="printInvoices">PDF/Druk</button>
        </div>
        <table id="invoicesTable" class="table"></table>
        <div class="pagination" id="invPager"></div>
      </section>

      <section id="tab-activities" class="tab">
        <h1>Aktywności</h1>
        <div class="toolbar filters">
          <input type="date" id="actFrom" />
          <input type="date" id="actTo" />
          <select id="actType">
            <option value="">Typ: wszystkie</option>
            <option value="deal">deal</option>
            <option value="payment">payment</option>
            <option value="support">support</option>
            <option value="deploy">deploy</option>
          </select>
          <select id="actStatus">
            <option value="">Status: wszystkie</option>
            <option value="OK">OK</option>
            <option value="WARN">WARN</option>
            <option value="Pending">Pending</option>
          </select>
          <button id="actApply">Filtruj</button>
        </div>
        <table id="activitiesTableFull" class="table"></table>
        <div class="pagination" id="actPager"></div>
      </section>

      <section id="tab-agents" class="tab">
        <h1>Health agentów</h1>
        <div id="agentsGrid" class="cards"></div>
      </section>

      <section id="tab-roles" class="tab">
        <h1>Role (Admin)</h1>
        <form id="newRoleForm" class="row">
          <input id="roleName" placeholder="Nazwa roli" />
          <input id="rolePerms" placeholder='Uprawnienia (JSON, np. ["finance:read"])' />
          <button type="submit">Dodaj</button>
        </form>
        <div id="rolesList" class="list"></div>
      </section>

    </main>
  </div>

  <!-- Drilldown modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button id="modalClose">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
